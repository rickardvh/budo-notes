name: Correct Shoden text

on:
  push:
    branches:
      - omori-ryu-draft

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omori-ryu-draft
          fetch-depth: 0

      - name: Correct obvious transcription and translation errors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('iaido/msr/shoden.md')
          text = path.read_text()

          replacements = [
              ('五本之仕形有と云ふ或は', '五本之仕形有と云々或は'),
              ('右足踵が左膝に来る如く', '右足踵が左膝頭附近に来る如く'),
              ('又実施者は敵を「フッツり切る気分を持つべきである。之を「ふつのみたま」と古語にあり。', '又実施者は敵を「フッツリ切る」気合を持つべきである。之を「ふつのみたま」と古語にあり。'),
              ('Draw as the right heel is set down so as to come to the left knee.', 'Draw as the right heel is set down near the head of the left knee.'),
              ('One should have the feeling of cutting the enemy clean through—expressed by the old phrase *futsu no mitama*.', 'One should have the intent to cut the enemy clean through—expressed in the ancient name *Futsu-no-mitama*[^futsu-no-mitama].'),
              ('When the enemy escapes, immediately pursue and cut him down.', 'When the enemy evades the cut, immediately pursue and cut him down.'),
              ('Place the left hand at the waist and open the right fist to the right so that the edge faces diagonally downwards to the right;', 'Place the left hand at the waist and move the right fist out to the right so that the edge faces diagonally downwards to the right;'),
              ('恰も前に「のめり」たるの浮腰（肋部を斬る）', '恰も前に「のめり」たる敵の浮腰（肋部を斬る）'),
              ('掌の反面を以て鍔を被ふ如く', '掌の半面を以て鍔を被ふ如く'),
              ('cutting the floating ribs or waist as the enemy pitches forwards.', "cutting the enemy's waist/rib region as he pitches forwards."),
              ('Meaning: Sit on the left side of the person committing seppuku, facing him, and perform kaishaku.', 'Juntō is also called *kaishaku*.\n\nMeaning: Sit on the left side of the person committing seppuku, facing him, and perform kaishaku.'),
              ('There is also a method in which one sweeps the enemy aside with nukitsuke before performing uchikomi.', 'There is also a method in which one sweeps aside with nukitsuke before performing uchikomi.'),
              ('刀を頭上に握り被り', '刀を頭上に振り被り'),
              ('Release the left hand and open the right fist to the right, performing chiburi in the same manner as the first chiburi of In\'yō-shintai.', 'Release the left hand and move the right fist out to the right, performing chiburi in the same manner as the first chiburi of In\'yō-shintai.'),
              ('[^4]: `ふんぬんて` represents `踏ん伸んで`. The repeated `請` in `請請流し` appears to be a dittography.', '[^4]: `ふんぬんて` represents `踏ん伸んで`, read *fun’nunde* (ふんぬんで); the dakuten on `て` is unmarked in this witness. The repeated `請` in `請請流し` appears to be a dittography.'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new, 1)

          if '[^futsu-no-mitama]:' not in text:
              futsu_note = '[^futsu-no-mitama]: `ふつのみたま` almost certainly refers to *Futsu-no-mitama* (布都御魂), the divine sword associated with Takemikazuchi and Isonokami Jingū. Here the name is explicitly linked with `フッツリ切る`, cutting clean through.\n'
              text = text.replace('[^musashi-no-kami]:', futsu_note + '[^musashi-no-kami]:', 1)

          path.write_text(text.rstrip() + '\n')
          PY

      - name: Commit corrections and remove workflow
        run: |
          rm -f .github/workflows/correct-shoden.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iaido/msr/shoden.md .github/workflows/correct-shoden.yml
          git commit -m "Correct Shoden transcription and translation errors"
          git push origin HEAD:omori-ryu-draft
