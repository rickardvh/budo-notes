name: Apply Shoden transcription corrections

on:
  push:
    branches:
      - omori-ryu-draft

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omori-ryu-draft
          fetch-depth: 0

      - name: Apply requested corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('iaido/msr/shoden.md')
          text = path.read_text()
          replacements = [
              ('右膝を軸として九十度旋廻', '右膝を軸として九十度左に旋廻'),
              ('刀刃を上にする如く右足の前方に致し', '刀刃を上にする如く右足の側方に致し'),
              ('順刀（介錯とも云ふ）', '順刀（介錯刀とも云ふ）'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit article update and remove workflow
        run: |
          rm -f .github/workflows/apply-shoden-transcription-corrections.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add iaido/msr/shoden.md .github/workflows/apply-shoden-transcription-corrections.yml
          git commit -m "Correct Shoden source readings"
          git push origin HEAD:omori-ryu-draft

# trigger
